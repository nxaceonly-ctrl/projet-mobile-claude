# Publie l'app sur Expo (EAS Update) à chaque envoi sur main,
# pour pouvoir l'ouvrir dans Expo Go sans ordinateur.
# Nécessite le secret GitHub EXPO_TOKEN (jeton créé sur expo.dev).
name: Aperçu Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Crée (ou retrouve) le projet "ascendant" sur ton compte Expo.
      - run: eas init --non-interactive --force

      - run: eas update:configure --platform all --non-interactive

      - run: eas update --branch preview --message "${{ github.event.head_commit.message || 'Mise à jour manuelle' }}" --non-interactive
